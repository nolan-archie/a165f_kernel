name: Weekly Kernel Build

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      sukisu_branch:
        description: 'SukiSU branch/tag/commit for setup.sh'
        required: false
        default: 'builtin'
      susfs_branch:
        description: 'SUSFS branch/tag/commit from gitlab.com/simonpunk/susfs4ksu'
        required: false
        default: 'gki-android13-5.10'
      build_version:
        description: 'Version label blank for auto commit count'
        required: false
        default: ''
      manager_version:
        description: 'Manager version blank for latest SukiSU release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build A165F Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Swap Space
        run: |
          echo "Allocating 12 GB of extra swap to prevent LTO OOM kills..."
          sudo fallocate -l 12G /mnt/build-swapfile || sudo dd if=/dev/zero of=/mnt/build-swapfile bs=1M count=12288 status=progress
          sudo chmod 600 /mnt/build-swapfile
          sudo mkswap /mnt/build-swapfile
          sudo swapon /mnt/build-swapfile
          echo "=== Memory and Swap Status ==="
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential rsync python3 python3-dev git \
            tar gzip curl wget bc cpio flex bison zip unzip patch \
            libssl-dev device-tree-compiler libelf-dev \
            libncurses-dev lld llvm clang ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi crossbuild-essential-arm64
          python3 --version

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            kernel/prebuilts
            kernel/prebuilts-master
            prebuilts
          key: samsung-ndk-toolchain-v2

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          TOOLCHAIN_URL="https://github.com/ravindu644/android_kernel_a165f/releases/download/toolchain/toolchain.tar.gz"
          curl -L --progress-bar "$TOOLCHAIN_URL" -o toolchain.tar.gz
          tar -xzf toolchain.tar.gz -C .
          rm toolchain.tar.gz
          echo "=== Extracted clang binaries ==="
          find . -maxdepth 5 -name "clang" -type f 2>/dev/null | head -10

      - name: Ensure prebuilts-master symlink
        run: |
          CLANG_BIN="kernel/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang"
          if [ ! -f "$CLANG_BIN" ] && [ ! -L "$CLANG_BIN" ]; then
            echo "Clang missing at prebuilts-master, checking prebuilts..."
            if [ -d "kernel/prebuilts/clang" ]; then
              echo "Found at kernel/prebuilts — creating symlink"
              ln -sfn "${GITHUB_WORKSPACE}/kernel/prebuilts" \
                "${GITHUB_WORKSPACE}/kernel/prebuilts-master"
            else
              echo "Prebuilt toolchain not found in either path!"
              echo "Falling back to apt clang at expected prebuilt path..."
              BIN_DIR="kernel/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"
              mkdir -p "$BIN_DIR"
              for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy \
                llvm-objdump llvm-readelf llvm-strip llvm-ranlib; do
                SYS="$(which $tool 2>/dev/null || true)"
                [ -n "$SYS" ] && ln -sf "$SYS" "$BIN_DIR/$tool" && echo " linked: $tool"
              done
            fi
          else
            echo "Clang already present at prebuilts-master — no action needed"
          fi
          echo "=== Clang validation ==="
          kernel/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang --version

      - name: Generate build version
        env:
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          INPUT_SUKISU_BRANCH: ${{ inputs.sukisu_branch }}
          INPUT_SUSFS_BRANCH: ${{ inputs.susfs_branch }}
        run: |
          if [ -n "$INPUT_BUILD_VERSION" ]; then
            BUILD_VERSION="$INPUT_BUILD_VERSION"
          else
            COUNT=$(git rev-list --count HEAD)
            MAJOR=$((COUNT / 100))
            MINOR=$((COUNT % 100))
            BUILD_VERSION=$(printf 'v%d.%02d' "$MAJOR" "$MINOR")
          fi
          BUILD_VERSION=$(echo "$BUILD_VERSION" | tr -d ' ')
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          BRANCH="$INPUT_SUKISU_BRANCH"
          if [ -z "$BRANCH" ]; then
            BRANCH="builtin"
          fi
          echo "SUKISU_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          SUSFS_BRANCH="$INPUT_SUSFS_BRANCH"
          if [ -z "$SUSFS_BRANCH" ]; then
            SUSFS_BRANCH="gki-android13-5.10"
          fi
          echo "SUSFS_BRANCH=$SUSFS_BRANCH" >> "$GITHUB_ENV"
          echo "Build Version: ${BUILD_VERSION}"
          echo "SukiSU Branch: ${BRANCH}"
          echo "SUSFS Branch: ${SUSFS_BRANCH}"

      - name: Integrate SukiSU-Ultra
        run: |
          set -euo pipefail
          cd kernel-5.10
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            -o /tmp/sukisu_setup.sh
          bash /tmp/sukisu_setup.sh "${SUKISU_BRANCH}"
          test -d KernelSU/kernel
          cd ..
      - name: Integrate SUSFS
        run: |
          set -euo pipefail
          rm -rf /tmp/susfs4ksu
          git clone --depth=1 --branch "${SUSFS_BRANCH}" \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu

          # Copy SUSFS core files to kernel
          cp -f /tmp/susfs4ksu/kernel_patches/fs/susfs.c kernel-5.10/fs/susfs.c
          cp -f /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h kernel-5.10/include/linux/susfs.h
          cp -f /tmp/susfs4ksu/kernel_patches/include/linux/susfs_def.h kernel-5.10/include/linux/susfs_def.h

          # Add susfs.o to fs/Makefile
          if ! grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' kernel-5.10/fs/Makefile; then
            printf '\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n' >> kernel-5.10/fs/Makefile
            echo "Added susfs.o to fs/Makefile"
          else
            echo "susfs.o already in fs/Makefile"
          fi

          # Patch KernelSU Kconfig to enable SUSFS options
          cd kernel-5.10/KernelSU
          if [ -f kernel/Kconfig ] && ! grep -q 'config KSU_SUSFS' kernel/Kconfig 2>/dev/null; then
            patch -p1 --forward < /tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || {
              echo "KernelSU SUSFS Kconfig patch failed or already applied"
            }
          else
            echo "KernelSU SUSFS Kconfig already present or Kconfig not found"
          fi
          cd "${GITHUB_WORKSPACE}"

          # >>>>> CRITICAL FIX: Manually patch susfs.h and susfs.c <<<<<
          # The SUSFS kernel patch fails on Samsung's modified kernel.
          # We must add the missing declarations and definitions manually.
          cd kernel-5.10

          # 1. Add missing declarations to susfs.h
          # NOTE: susfs_is_sdcard_android_data_decrypted is used as a VARIABLE by Samsung/SukiSU,
          # not as a function. So we declare it as extern bool, not a function.
          printf '\n/* Additional declarations for SukiSU compatibility */\n' >> include/linux/susfs.h
          printf '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n' >> include/linux/susfs.h
          printf 'extern bool susfs_is_sdcard_android_data_decrypted;\n' >> include/linux/susfs.h
          printf 'void susfs_run_sus_path_loop(void);\n' >> include/linux/susfs.h
          printf '#endif\n' >> include/linux/susfs.h
          printf '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n' >> include/linux/susfs.h
          printf 'bool susfs_is_current_proc_umounted(void);\n' >> include/linux/susfs.h
          printf 'bool susfs_is_current_proc_umounted_app(void);\n' >> include/linux/susfs.h
          printf '#endif\n' >> include/linux/susfs.h
          printf '#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n' >> include/linux/susfs.h
          printf 'void susfs_sus_kstat_spoof_generic_fillattr(struct inode *inode, struct kstat *stat);\n' >> include/linux/susfs.h
          printf 'void susfs_sus_kstat_spoof_show_map_vma(struct inode *inode, dev_t *out_dev, unsigned long *out_ino);\n' >> include/linux/susfs.h
          printf '#endif\n' >> include/linux/susfs.h
          printf '#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n' >> include/linux/susfs.h
          printf 'struct filename *susfs_open_redirect_spoof_do_sys_openat(struct inode *inode);\n' >> include/linux/susfs.h
          printf 'int susfs_open_redirect_spoof_vfs_readlink(struct inode *inode, char __user *buffer, int buflen);\n' >> include/linux/susfs.h
          printf 'int susfs_open_redirect_spoof_do_proc_readlink(struct inode *inode, char *tmp_buf, int buflen);\n' >> include/linux/susfs.h
          printf 'int susfs_open_redirect_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf);\n' >> include/linux/susfs.h
          printf 'int susfs_open_redirect_spoof_seq_show(struct inode *inode, int *out_mnt_id, unsigned long *out_ino);\n' >> include/linux/susfs.h
          printf 'int susfs_open_redirect_spoof_show_map_vma(struct inode *inode, unsigned long *out_ino, dev_t *out_dev, char *spoofed_name);\n' >> include/linux/susfs.h
          printf '#endif\n' >> include/linux/susfs.h
          echo "Added missing declarations to susfs.h"

          # 2. Fix susfs.c - remove 'static' from susfs_run_sus_path_loop so it can be called externally
          sed -i -E 's/^[[:space:]]*static[[:space:]]+void[[:space:]]+susfs_run_sus_path_loop[[:space:]]*\(/void susfs_run_sus_path_loop(/' fs/susfs.c
          echo "Removed 'static' from susfs_run_sus_path_loop"

          # 3. Add variable definition to susfs.c (NOT a function)
          # The variable must be defined and kept in sync with the static key.
          STATIC_KEY_LINE=$(grep -n 'DEFINE_STATIC_KEY_TRUE(susfs_is_sdcard_android_data_not_decrypted)' fs/susfs.c | head -1 | cut -d: -f1)
          if [ -n "$STATIC_KEY_LINE" ]; then
            sed -i "${STATIC_KEY_LINE}a bool susfs_is_sdcard_android_data_decrypted = false;" fs/susfs.c
            echo "Added variable definition after static key (line $STATIC_KEY_LINE)"
          else
            sed -i '1a bool susfs_is_sdcard_android_data_decrypted = false;' fs/susfs.c
            echo "Added variable definition at top (fallback)"
          fi

          # 4. Update the variable whenever the static key is changed
          # Use Python for multiline replacement (sed can't handle \n in replacement)
          # Write Python script to a temp file first to avoid YAML quote issues
          cat > /tmp/fix_susfs.py << 'PYEOF'
          import sys
          with open('fs/susfs.c', 'r') as f:
              content = f.read()
          old = 'static_branch_disable(&susfs_is_sdcard_android_data_not_decrypted);'
          new = 'static_branch_disable(&susfs_is_sdcard_android_data_not_decrypted);\n\tsusfs_is_sdcard_android_data_decrypted = true;'
          content = content.replace(old, new)
          with open('fs/susfs.c', 'w') as f:
              f.write(content)
          PYEOF
          python3 /tmp/fix_susfs.py
          echo "Added variable updates after static key changes"

          # 5. Add #include <linux/susfs.h> to all files that need it
          add_susfs_include() {
            local file="$1"
            if [ -f "$file" ] && ! grep -q '#include <linux/susfs.h>' "$file"; then
              local last_include=$(grep -n '#include <linux/' "$file" | tail -1 | cut -d: -f1)
              if [ -n "$last_include" ]; then
                sed -i "${last_include}a #include <linux/susfs.h>" "$file"
                echo "Added susfs.h include to $file"
              else
                sed -i '1a #include <linux/susfs.h>' "$file"
                echo "Added susfs.h include to $file (fallback)"
              fi
            else
              if [ -f "$file" ]; then
                echo "susfs.h already included in $file"
              else
                echo "File not found: $file"
              fi
            fi
          }

          SUSFS_FILES="
            drivers/input/input.c
            fs/exec.c
            fs/namei.c
            fs/namespace.c
            fs/notify/fdinfo.c
            fs/open.c
            fs/proc/base.c
            fs/proc/bootconfig.c
            fs/proc/fd.c
            fs/proc/task_mmu.c
            fs/proc_namespace.c
            fs/read_write.c
            fs/readdir.c
            fs/stat.c
            fs/statfs.c
            kernel/kallsyms.c
            kernel/reboot.c
            kernel/sys.c
            mm/memory.c
            security/selinux/avc.c
            security/selinux/hooks.c
            security/selinux/selinuxfs.c
          "
          
          for f in $SUSFS_FILES; do
            add_susfs_include "$f"
          done

          # Also ensure SukiSU's setuid_hook.c has the include
          if [ -f drivers/kernelsu/setuid_hook.c ]; then
            add_susfs_include "drivers/kernelsu/setuid_hook.c"
          fi

          # 6. Verify ALL changes
          echo "=== Verifying SUSFS fixes ==="
          echo "--- susfs.h declarations ---"
          if grep -q "extern bool susfs_is_sdcard_android_data_decrypted" include/linux/susfs.h; then
            echo "✓ susfs_is_sdcard_android_data_decrypted declared as variable"
          else
            echo "✗ MISSING: susfs_is_sdcard_android_data_decrypted variable declaration in susfs.h"
            exit 1
          fi
          if grep -q "susfs_run_sus_path_loop" include/linux/susfs.h; then
            echo "✓ susfs_run_sus_path_loop declared"
          else
            echo "✗ MISSING: susfs_run_sus_path_loop in susfs.h"
            exit 1
          fi
          
          echo "--- susfs.c definitions ---"
          if grep -q "^void susfs_run_sus_path_loop" fs/susfs.c; then
            echo "✓ susfs_run_sus_path_loop defined (non-static)"
          else
            echo "✗ MISSING: non-static susfs_run_sus_path_loop in susfs.c"
            exit 1
          fi
          if grep -q "bool susfs_is_sdcard_android_data_decrypted" fs/susfs.c; then
            echo "✓ susfs_is_sdcard_android_data_decrypted defined as variable"
          else
            echo "✗ MISSING: susfs_is_sdcard_android_data_decrypted variable in susfs.c"
            exit 1
          fi
          if grep -q "susfs_is_sdcard_android_data_decrypted = true" fs/susfs.c; then
            echo "✓ Variable update added after static key changes"
          else
            echo "✗ MISSING: variable update in susfs.c"
            exit 1
          fi

          echo "--- File includes ---"
          for f in fs/exec.c fs/namespace.c drivers/kernelsu/setuid_hook.c; do
            if [ -f "$f" ]; then
              if grep -q '#include <linux/susfs.h>' "$f"; then
                echo "✓ $f has susfs.h"
              else
                echo "✗ MISSING: $f"
                exit 1
              fi
            fi
          done

          cd "${GITHUB_WORKSPACE}"

          # Extract SUSFS version for release notes
          SUSFS_VERSION=$(awk '
            $1 == "#define" && $2 == "SUSFS_VERSION" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' kernel-5.10/include/linux/susfs.h 2>/dev/null || true)
          SUSFS_VERSION="${SUSFS_VERSION:-unknown}"
          echo "SUSFS_VERSION=${SUSFS_VERSION}" >> "$GITHUB_ENV"
          echo "SUSFS ${SUSFS_VERSION} integrated from ${SUSFS_BRANCH}"
      - name: Write version defconfig
        run: |
          mkdir -p kernel-5.10/arch/arm64/configs
          printf 'CONFIG_LOCALVERSION_AUTO=n\nCONFIG_LOCALVERSION="-nolanarchie-dev"\n' \
            > kernel-5.10/arch/arm64/configs/version.config

      - name: Write knox defconfig
        run: |
          mkdir -p kernel-5.10/arch/arm64/configs
          printf '%s\n' \
            'CONFIG_SAMSUNG_PRODUCT_SHIP=n' \
            'CONFIG_SEC_RESTRICT_FORK=n' \
            'CONFIG_SEC_RESTRICT_SETUID=n' \
            'CONFIG_UH=n' \
            'CONFIG_RKP=n' \
            'CONFIG_RKP_CFP=n' \
            'CONFIG_KDP=n' \
            'CONFIG_FIVE=n' \
            > kernel-5.10/arch/arm64/configs/disable_knox.config

      - name: Write permissive defconfig
        run: |
          printf '%s\n' \
            'CONFIG_SECURITY_SELINUX_DEVELOP=y' \
            'CONFIG_SECURITY_SELINUX_BOOTPARAM=y' \
            'CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0' \
            > kernel-5.10/arch/arm64/configs/permissive.config

      - name: Write susfs defconfig
        run: |
          printf '%s\n' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_MANUAL_SU=y' \
            'CONFIG_KSU_SUSFS=y' \
            'CONFIG_KSU_SUSFS_SUS_PATH=y' \
            'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
            'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' \
            'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
            'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' \
            'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y' \
            'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' \
            'CONFIG_KSU_SUSFS_SUS_MAP=y' \
            > kernel-5.10/arch/arm64/configs/susfs.config

      - name: Create root symlinks
        run: |
          for d in custom_defconfigs prebuilts_helio_g99 oem_prebuilt_images; do
            if [ -d "${GITHUB_WORKSPACE}/$d" ] && [ ! -e "/$d" ]; then
              sudo ln -sf "${GITHUB_WORKSPACE}/$d" "/$d"
              echo "Symlink: /$d"
            fi
          done

      - name: Generate build config
        run: |
          OUTDIR="${GITHUB_WORKSPACE}/out/target/product/a16/obj/KERNEL_OBJ"
          mkdir -p "$OUTDIR"
          rm -f "$OUTDIR/build.config" "$OUTDIR/build.config.gki.aarch64" "$OUTDIR/build.config.mtk"
          cd "${GITHUB_WORKSPACE}/kernel-5.10"
          python3 scripts/gen_build_config.py \
            --kernel-defconfig a16_00_defconfig \
            --kernel-defconfig-overlays "entry_level.config version.config disable_knox.config permissive.config susfs.config" \
            -m user \
            -o "$OUTDIR/build.config"
          cd "${GITHUB_WORKSPACE}"
          head -5 "$OUTDIR/build.config"

      - name: Build kernel
        run: |
          WDIR="${GITHUB_WORKSPACE}"
          OUTDIR="${WDIR}/out/target/product/a16/obj/KERNEL_OBJ"
          export ARCH=arm64
          export PLATFORM_VERSION=13
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
          export OUT_DIR="../out/target/product/a16/obj/KERNEL_OBJ"
          export DIST_DIR="../out/target/product/a16/obj/KERNEL_OBJ"
          export BUILD_CONFIG="../out/target/product/a16/obj/KERNEL_OBJ/build.config"
          export MERGE_CONFIG="${WDIR}/kernel-5.10/scripts/kconfig/merge_config.sh"
          export WDIR="${WDIR}"
          export GKI_RAMDISK_PREBUILT_BINARY="${WDIR}/oem_prebuilt_images/gki-ramdisk.lz4"
          export MKBOOTIMG_EXTRA_ARGS="--os_version 12.0.0 --os_patch_level 2025-05-00 --pagesize 4096"
          export SKIP_MRPROPER=1
          export KMI_SYMBOL_LIST_STRICT_MODE=0
          export ABI_DEFINITION=
          export BUILD_BOOT_IMG=1
          export MKBOOTIMG_PATH="${WDIR}/mkbootimg/mkbootimg.py"
          export KERNEL_BINARY=Image.gz
          export BOOT_IMAGE_HEADER_VERSION=4
          export SKIP_VENDOR_BOOT=1
          export AVB_SIGN_BOOT_IMG=1
          export AVB_BOOT_PARTITION_SIZE=67108864
          export AVB_BOOT_KEY="${WDIR}/mkbootimg/tests/data/testkey_rsa2048.pem"
          export AVB_BOOT_ALGORITHM=SHA256_RSA2048
          export AVB_BOOT_PARTITION_NAME=boot
          export LTO=thin
          export KCFLAGS="-Wframe-larger-than=16384"
          cd "${GITHUB_WORKSPACE}/kernel"
          ./build/build.sh 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
          exit ${PIPESTATUS[0]}

      - name: Collect artifacts
        run: |
          WDIR="${GITHUB_WORKSPACE}"
          OUTDIR="${WDIR}/out/target/product/a16/obj/KERNEL_OBJ"
          DIST="${WDIR}/dist"
          mkdir -p "$DIST"
          if [ -f "$OUTDIR/boot.img" ]; then
            cp "$OUTDIR/boot.img" "$DIST/"
            echo "boot.img collected"
          fi
          IMGZ="$OUTDIR/kernel-5.10/arch/arm64/boot/Image.gz"
          if [ -f "$IMGZ" ]; then
            cp "$IMGZ" "$DIST/"
            echo "Image.gz collected"
          fi
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_tmp
          if [ -f "$DIST/Image.gz" ]; then
            cp "$DIST/Image.gz" ak3_tmp/
          fi
          printf '%s\n' \
            'kernel.string=SukiSU-Ultra @ nolan-archie' \
            'do.devicecheck=1' \
            'do.modules=0' \
            'do.systemless=1' \
            'do.cleanup=1' \
            'do.cleanuponabort=0' \
            'device.name1=a16' \
            'device.name2=a165f' \
            'device.name3=a155f' \
            'device.name4=A165F' \
            'device.name5=A155F' \
            'block=/dev/block/platform/bootdevice/by-name/boot;' \
            'is_slot_device=0;' \
            'ramdisk_compression=auto;' \
            > ak3_tmp/anykernel.sh
          ZIP="SukiSU-Ultra-A165F-${BUILD_VERSION}.zip"
          cd ak3_tmp
          zip -r9 "$DIST/$ZIP" . -x ".git/*" "*.md"
          cd "${GITHUB_WORKSPACE}"
          echo "ARTIFACT_ZIP=$ZIP" >> $GITHUB_ENV
          TAR="SukiSU-Ultra-A165F-${BUILD_VERSION}.tar"
          cd "$DIST"
          if [ -f boot.img ] && [ -f Image.gz ]; then
            tar -cvf "$TAR" boot.img Image.gz
          elif [ -f boot.img ]; then
            tar -cvf "$TAR" boot.img
          fi
          echo "ARTIFACT_TAR=$TAR" >> $GITHUB_ENV
          cd "${GITHUB_WORKSPACE}"

      - name: Resolve release metadata
        env:
          MANAGER_VERSION_OVERRIDE: ${{ inputs.manager_version }}
        run: |
          set -euo pipefail
          RELEASE_KERNEL_VERSION=$(awk '
            $1 == "VERSION" && $2 == "=" { version = $3 }
            $1 == "PATCHLEVEL" && $2 == "=" { patchlevel = $3 }
            $1 == "SUBLEVEL" && $2 == "=" { sublevel = $3 }
            $1 == "EXTRAVERSION" && $2 == "=" { extraversion = $3 }
            END {
              if (version == "" || patchlevel == "") { exit 1 }
              printf "%s.%s", version, patchlevel
              if (sublevel != "") { printf ".%s", sublevel }
              printf "%s\n", extraversion
            }
          ' kernel-5.10/Makefile)
          SUSFS_VERSION=$(awk '
            $1 == "#define" && $2 == "SUSFS_VERSION" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' kernel-5.10/include/linux/susfs.h 2>/dev/null || true)
          SUSFS_VERSION="${SUSFS_VERSION:-unknown}"
          MANAGER_NAME="SukiSu Ultra"
          MANAGER_VERSION="${MANAGER_VERSION_OVERRIDE:-}"
          if [ -z "$MANAGER_VERSION" ]; then
            MANAGER_VERSION=$(curl --fail --show-error --silent --retry 3 --retry-delay 5 \
              "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("tag_name", ""))' \
              || true)
          fi
          if [ -z "$MANAGER_VERSION" ]; then
            for kbuild in kernel-5.10/KernelSU/kernel/Kbuild KernelSU/kernel/Kbuild; do
              if [ -f "$kbuild" ]; then
                MANAGER_VERSION=$(awk '
                  $1 == "KSU_VERSION_API" && $2 == ":=" {
                    print "v" $3
                    exit
                  }
                ' "$kbuild")
                [ -n "$MANAGER_VERSION" ] && break
              fi
            done
          fi
          MANAGER_VERSION="${MANAGER_VERSION:-unknown}"
          {
            echo "MANAGER_NAME=${MANAGER_NAME}"
            echo "MANAGER_VERSION=${MANAGER_VERSION}"
            echo "SUSFS_VERSION=${SUSFS_VERSION}"
            echo "RELEASE_KERNEL_VERSION=${RELEASE_KERNEL_VERSION}"
          } >> "$GITHUB_ENV"
          echo "Manager: ${MANAGER_NAME} ${MANAGER_VERSION}"
          echo "SUSFS: ${SUSFS_VERSION}"
          echo "Kernel: ${RELEASE_KERNEL_VERSION}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 14

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.BUILD_VERSION }}
          commit: ${{ github.sha }}
          name: "SukiSU Ultra ${{ env.BUILD_VERSION }} ${{ env.SUKISU_BRANCH }}"
          body: |
            SM-A165F / SM-A155F Auto Build
            SukiSU-Ultra branch: ${{ env.SUKISU_BRANCH }}
            SUSFS branch: ${{ env.SUSFS_BRANCH }}
            SUSFS version: ${{ env.SUSFS_VERSION }}
            Build: ${{ env.BUILD_VERSION }}
            SELinux: PERMISSIVE
            Flashing:
            boot.img - fastboot flash boot boot.img or TWRP
            zip - Flash in TWRP or OrangeFox
            tar - Odin format
          artifacts: |
            dist/boot.img
            dist/Image.gz
            dist/${{ env.ARTIFACT_ZIP }}
            dist/${{ env.ARTIFACT_TAR }}
          draft: false
          prerelease: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram release message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          : "${TELEGRAM_BOT_TOKEN:?Set the TELEGRAM_BOT_TOKEN repository secret}"
          : "${TELEGRAM_CHAT_ID:?Set the TELEGRAM_CHAT_ID repository secret}"
          if [ ! -f dist/boot.img ]; then
            echo "dist/boot.img was not produced"
            exit 1
          fi
          BOOT_IMG_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${BUILD_VERSION}/boot.img"
          MESSAGE=$(printf '%s\n' \
            'NEW RELEASE!!!!!' \
            '' \
            'Stable kernel release for A165F' \
            '' \
            'FEATURES:' \
            "Upstreamed the kernel to ${RELEASE_KERNEL_VERSION}" \
            'INLINE HOOK: ✅' \
            'SUSFS: ✅' \
            'SUS MOUNT: ✅' \
            'KSTAT: ✅' \
            'UNAME: ✅' \
            'LOG: ✅' \
            'HIDE SUSFS KSU SUSFS SYMBOLS: ✅' \
            'SUSFS SPOOF CMDLINE OR BOOTCONFIG: ✅' \
            'OPEN DIRECT: ✅' \
            'SUS MAP: ✅' \
            '' \
            "Manager: ${MANAGER_NAME}" \
            "Manager version: ${MANAGER_VERSION}" \
            "SUSFS version: ${SUSFS_VERSION}" \
            "Kernel version: ${RELEASE_KERNEL_VERSION}" \
            '' \
            'DOWNLOAD:' \
            "${BOOT_IMG_URL}" \
            '' \
            'Disclaimer: I am not responsible for any bricked device...')
          curl --fail-with-body --show-error --silent --retry 3 --retry-delay 5 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

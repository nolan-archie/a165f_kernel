name: Weekly Kernel Build

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      sukisu_branch:
        description: 'SukiSU branch e.g. susfs-main susfs-test'
        required: false
        default: 'susfs-main'
      build_version:
        description: 'Version label blank for auto date'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build A165F Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: false

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential rsync python3 python3-dev git \
          tar gzip curl wget bc cpio flex bison zip unzip \
          libssl-dev device-tree-compiler libelf-dev \
          libncurses-dev lld llvm ccache
        python3 --version

    - name: Cache toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: |
          kernel/prebuilts
          prebuilts
        key: samsung-ndk-toolchain-v1

    - name: Download toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        TOOLCHAIN_URL="https://github.com/ravindu644/android_kernel_a165f/releases/download/toolchain/toolchain.tar.gz"
        curl -L --progress-bar "$TOOLCHAIN_URL" -o toolchain.tar.gz
        tar -xzf toolchain.tar.gz -C .
        rm toolchain.tar.gz

    - name: Set version
      run: |
        if [ -n "${{ github.event.inputs.build_version }}" ]; then
          echo "BUILD_VERSION=${{ github.event.inputs.build_version }}" >> $GITHUB_ENV
        else
          echo "BUILD_VERSION=weekly-$(date +%Y%m%d)" >> $GITHUB_ENV
        fi
        BRANCH="${{ github.event.inputs.sukisu_branch }}"
        if [ -z "$BRANCH" ]; then
          BRANCH="susfs-main"
        fi
        echo "SUKISU_BRANCH=$BRANCH" >> $GITHUB_ENV

    - name: Integrate SukiSU-Ultra
      run: |
        cd kernel-5.10
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
          | bash -s -- "$SUKISU_BRANCH"
        cd ..

    - name: Write knox defconfig
      run: |
        mkdir -p custom_defconfigs
        printf '%s\n' \
          'CONFIG_SAMSUNG_PRODUCT_SHIP=n' \
          'CONFIG_SEC_RESTRICT_FORK=n' \
          'CONFIG_SEC_RESTRICT_SETUID=n' \
          'CONFIG_UH=n' \
          'CONFIG_RKP=n' \
          'CONFIG_RKP_CFP=n' \
          'CONFIG_KDP=n' \
          'CONFIG_FIVE=n' \
          > custom_defconfigs/disable_knox.config

    - name: Create symlinks
      run: |
        for d in custom_defconfigs prebuilts_helio_g99 oem_prebuilt_images; do
          if [ -d "${GITHUB_WORKSPACE}/$d" ] && [ ! -e "/$d" ]; then
            sudo ln -sf "${GITHUB_WORKSPACE}/$d" "/$d"
          fi
        done

    - name: Write version defconfig
      run: |
        mkdir -p custom_defconfigs
        echo "CONFIG_LOCALVERSION_AUTO=n" > custom_defconfigs/version_defconfig
        echo "CONFIG_LOCALVERSION=\"-nolanarchie-$BUILD_VERSION\"" >> custom_defconfigs/version_defconfig

    - name: Generate build config
      run: |
        OUT="${GITHUB_WORKSPACE}/out/target/product/a16/obj/KERNEL_OBJ"
        mkdir -p "$OUT"
        cd "${GITHUB_WORKSPACE}/kernel-5.10"
        python3 scripts/gen_build_config.py \
          --kernel-defconfig a16_00_defconfig \
          --kernel-defconfig-overlays "entry_level.config disable_knox.config" \
          -m user \
          -o "$OUT/build.config"
        cd "${GITHUB_WORKSPACE}"

    - name: Build kernel
      run: |
        OUT="${GITHUB_WORKSPACE}/out/target/product/a16/obj/KERNEL_OBJ"
        export ARCH=arm64
        export PLATFORM_VERSION=13
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        export OUT_DIR="$OUT"
        export DIST_DIR="$OUT"
        export BUILD_CONFIG="$OUT/build.config"
        export MERGE_CONFIG="${GITHUB_WORKSPACE}/kernel-5.10/scripts/kconfig/merge_config.sh"
        export WDIR="${GITHUB_WORKSPACE}"
        export GKI_RAMDISK_PREBUILT_BINARY="${GITHUB_WORKSPACE}/oem_prebuilt_images/gki-ramdisk.lz4"
        export MKBOOTIMG_EXTRA_ARGS="--os_version 12.0.0 --os_patch_level 2025-05-00 --pagesize 4096"
        export SKIP_MRPROPER=1
        export KMI_SYMBOL_LIST_STRICT_MODE=0
        export ABI_DEFINITION=
        export BUILD_BOOT_IMG=1
        export MKBOOTIMG_PATH="${GITHUB_WORKSPACE}/mkbootimg/mkbootimg.py"
        export KERNEL_BINARY=Image.gz
        export BOOT_IMAGE_HEADER_VERSION=4
        export SKIP_VENDOR_BOOT=1
        export AVB_SIGN_BOOT_IMG=1
        export AVB_BOOT_PARTITION_SIZE=67108864
        export AVB_BOOT_KEY="${GITHUB_WORKSPACE}/mkbootimg/tests/data/testkey_rsa2048.pem"
        export AVB_BOOT_ALGORITHM=SHA256_RSA2048
        export AVB_BOOT_PARTITION_NAME=boot
        export LTO=none
        cd "${GITHUB_WORKSPACE}"
        kernel/build/build.sh 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
        exit ${PIPESTATUS[0]}

    - name: Collect artifacts
      run: |
        OUT="${GITHUB_WORKSPACE}/out/target/product/a16/obj/KERNEL_OBJ"
        DIST="${GITHUB_WORKSPACE}/dist"
        mkdir -p "$DIST"
        if [ -f "$OUT/boot.img" ]; then
          cp "$OUT/boot.img" "$DIST/"
        fi
        if [ -f "$OUT/kernel-5.10/arch/arm64/boot/Image.gz" ]; then
          cp "$OUT/kernel-5.10/arch/arm64/boot/Image.gz" "$DIST/"
        fi
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_tmp
        if [ -f "$DIST/Image.gz" ]; then
          cp "$DIST/Image.gz" ak3_tmp/
        fi
        printf '%s\n' \
          'kernel.string=SukiSU-Ultra @ nolan-archie' \
          'do.devicecheck=1' \
          'do.modules=0' \
          'do.systemless=1' \
          'do.cleanup=1' \
          'do.cleanuponabort=0' \
          'device.name1=a16' \
          'device.name2=a165f' \
          'device.name3=a155f' \
          'device.name4=A165F' \
          'device.name5=A155F' \
          'block=/dev/block/platform/bootdevice/by-name/boot;' \
          'is_slot_device=0;' \
          'ramdisk_compression=auto;' \
          '. tools/ak3-core.sh' \
          '. tools/magiskboot.sh' \
          'flash_image boot $block' \
          > ak3_tmp/anykernel.sh
        ZIP="SukiSU-Ultra-A165F-${BUILD_VERSION}.zip"
        cd ak3_tmp
        zip -r9 "$DIST/$ZIP" . -x ".git/*" "*.md"
        cd "${GITHUB_WORKSPACE}"
        echo "ARTIFACT_ZIP=$ZIP" >> $GITHUB_ENV
        TAR="SukiSU-Ultra-A165F-${BUILD_VERSION}.tar"
        cd "$DIST"
        tar -cvf "$TAR" boot.img Image.gz 2>/dev/null || tar -cvf "$TAR" boot.img 2>/dev/null || true
        echo "ARTIFACT_TAR=$TAR" >> $GITHUB_ENV
        cd "${GITHUB_WORKSPACE}"

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_number }}
        path: build.log
        retention-days: 14

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.BUILD_VERSION }}
        name: "SukiSU Ultra ${{ env.BUILD_VERSION }} ${{ env.SUKISU_BRANCH }}"
        body: |
          SM-A165F / SM-A155F Auto Weekly Build

          SukiSU-Ultra branch: ${{ env.SUKISU_BRANCH }}
          Build: ${{ env.BUILD_VERSION }}

          Flashing:
          boot.img - fastboot flash boot boot.img or TWRP
          zip - Flash in TWRP or OrangeFox
          tar - Odin format
        files: |
          dist/boot.img
          dist/Image.gz
          dist/${{ env.ARTIFACT_ZIP }}
          dist/${{ env.ARTIFACT_TAR }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

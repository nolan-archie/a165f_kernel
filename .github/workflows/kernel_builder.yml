name: Weekly Kernel Builder

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        branch: [suki-su-latest, suki-su-latest-permissive]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maximize Build Space
        run: |
          chmod +x scripts/maximize_space.sh
          ./scripts/maximize_space.sh

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y build-essential rsync bc bison flex libssl-dev libelf-dev python2.7 python2.7-dev
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare Build Workspace
        run: |
          git worktree add build-workspace ${{ matrix.branch }}
          cd build-workspace
          if git config --get submodule.susfs4ksu.url >/dev/null; then
            git submodule deinit -f susfs4ksu || true
            git rm --cached susfs4ksu 2>/dev/null || true
          fi

      - name: Update and Patch
        id: updates
        run: |
          cd build-workspace
          ../scripts/automate_updates.sh

          git status
          git add -A

          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-update KernelSU and SUSFS to latest commits"
            git push origin ${{ matrix.branch }} || echo "Push failed, but continuing build"
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected. Dependencies are already up to date."
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

          if [ -f changelog.md ]; then
            cp changelog.md ../changelog_${{ matrix.branch }}.md
          else
            echo "No new updates this week." > ../changelog_${{ matrix.branch }}.md
          fi

      - name: Verify KernelSU Consistency
        run: |
          cd build-workspace
          if grep -R -n "ksu_no_custom_rc" drivers/kernelsu >/tmp/ksu_hits.txt 2>/dev/null; then
            echo "KernelSU symbol usage found:"
            cat /tmp/ksu_hits.txt
          else
            echo "No ksu_no_custom_rc usage found."
          fi

          if grep -R -n "ksu_no_custom_rc" drivers/kernelsu/runtime/ksud_integration.c >/dev/null 2>&1; then
            if ! grep -R -n "ksu_no_custom_rc" drivers/kernelsu | grep -v "ksud_integration.c" >/dev/null 2>&1; then
              echo "KernelSU mismatch detected: ksud_integration.c references ksu_no_custom_rc but no declaration was found."
              exit 1
            fi
          fi

      - name: Build Kernel
        run: |
          cd build-workspace
          chmod +x build.sh
          ./build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.branch }}
          path: build-workspace/dist/*

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="build-$(date +'%Y.%m.%d')-${{ matrix.branch }}"
          RELEASE_NAME="Weekly Build - $(date +'%Y-%m-%d') (${{ matrix.branch }})"

          if [ -f "changelog_${{ matrix.branch }}.md" ]; then
            BODY_FILE="changelog_${{ matrix.branch }}.md"
          else
            echo "Weekly automated build for branch ${{ matrix.branch }}" > release_body.txt
            BODY_FILE="release_body.txt"
          fi

          gh release create "$TAG_NAME" \
            --title "$RELEASE_NAME" \
            --notes-file "$BODY_FILE" \
            --clobber \
            build-workspace/dist/*

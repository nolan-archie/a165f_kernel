name: Notify Telegram on Commit

on:
  push:
    branches: [ "susfs-dev", "main" ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message per commit
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo '${{ toJson(github.event.commits) }}' > commits.json

          COUNT=$(jq length commits.json)
          for i in $(seq 0 $((COUNT - 1))); do
            MSG=$(jq -r ".[$i].message" commits.json)
            AUTHOR=$(jq -r ".[$i].author.name" commits.json)
            SHA=$(jq -r ".[$i].id" commits.json | cut -c1-7)
            URL=$(jq -r ".[$i].url" commits.json)

            TEXT=$(printf '🔧 New commit on `%s`\nRepo: %s\nAuthor: %s\nMessage: %s\nCommit: %s' \
              "${{ github.ref_name }}" "${{ github.repository }}" "$AUTHOR" "$MSG" "$URL")

            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              --data-urlencode text="$TEXT"
          done

name: Notify Telegram on Commit

on:
  push:
    branches: [ "susfs-dev", "main" ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message per commit
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo '${{ toJson(github.event.commits) }}' > commits.json

          escape_html() {
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
          }

          COUNT=$(jq length commits.json)
          for i in $(seq 0 $((COUNT - 1))); do
            MSG=$(jq -r ".[$i].message" commits.json | escape_html)
            AUTHOR=$(jq -r ".[$i].author.name" commits.json | escape_html)
            SHA_FULL=$(jq -r ".[$i].id" commits.json)
            SHA=$(echo "$SHA_FULL" | cut -c1-7)
            URL=$(jq -r ".[$i].url" commits.json)
            REPO="${{ github.repository }}"
            BRANCH="${{ github.ref_name }}"

            TEXT=$(printf '<b>New Commit Pushed</b>\n\n<pre>Repo: %s\nBranch: %s\nAuthor: %s\nCommit: %s\nMessage: %s</pre>\n\n<a href="%s">View on GitHub</a>' \
              "$REPO" "$BRANCH" "$AUTHOR" "$SHA" "$MSG" "$URL")

            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d parse_mode="HTML" \
              -d disable_web_page_preview="true" \
              --data-urlencode text="$TEXT"
          done
